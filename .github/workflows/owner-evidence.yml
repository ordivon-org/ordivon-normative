name: Normative owner evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  owner-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record bounded evidence identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'github_sha=%s\n' "$GITHUB_SHA"
          printf 'checkout_head=%s\n' "$(git rev-parse HEAD)"
          printf 'head_ref=%s\n' "${GITHUB_HEAD_REF:-}"
          printf 'base_ref=%s\n' "${GITHUB_BASE_REF:-}"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
          sha256sum \
            .github/workflows/owner-evidence.yml \
            scripts/owner-environment \
            authority/CURRENT.json \
            conformance-witness/fixtures.json
      - name: Reproduce owner-native cold-start gate
        run: scripts/owner-environment cold-start
